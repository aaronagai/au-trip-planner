  <!-- Kick off the data download before anything else parses (parallel with fonts + Plotly) -->
  <link rel="preconnect" href="https://docs.google.com" crossorigin>

  <script>
    window.__sheetData = fetch(
      'https://docs.google.com/spreadsheets/d/1gyNpebYNfYJdqOYmgcamOuWquUk6sqhJ6Dbfo7dBLf0/export?format=csv&t=' + Date.now()
    ).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });

  <!-- "basic" bundle = pie + bar only (~1MB vs ~3.4MB full). defer = non-blocking. -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', sans-serif; background: #090909; color: #fff;
      padding: clamp(12px, 3vw, 24px);
      padding-left: max(clamp(12px, 3vw, 24px), env(safe-area-inset-left));
      padding-right: max(clamp(12px, 3vw, 24px), env(safe-area-inset-right));
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1200px; margin: 0 auto; width: 100%; }

    .label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #444; margin-bottom: 4px; }
    .page-title { font-size: clamp(18px, 5vw, 22px); font-weight: 700; color: #fff; margin-bottom: 4px; }
    .page-sub { font-size: 13px; color: #555; margin-bottom: 28px; }
    .section-header { font-size: 13px; font-weight: 600; color: #888; letter-spacing: 0.05em; text-transform: uppercase; margin: 28px 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #1a1a1a; }
    .sub { font-size: 12px; color: #555; margin-top: 2px; }

    .kpi-stack { background: #111; border: 1px solid #1f1f1f; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
    .kpi-item { padding: 16px 24px; }
    .kpi-item + .kpi-item { border-top: 1px solid #1f1f1f; }
    .kpi-val { font-size: 18px; font-weight: 700; color: #fff; margin: 2px 0; }

    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px; }
    .chart-card { background: #111; border: 1px solid #1f1f1f; border-radius: 8px; padding: 12px; overflow: hidden; }

    .progress-wrap { margin: 8px 0; }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 4px; }
    .progress-track { background: #1a1a1a; border-radius: 3px; height: 4px; }
    .progress-fill { height: 4px; border-radius: 3px; }

    .cal-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
    .cal-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #666; border-radius: 4px; padding: 5px 14px; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .cal-btn.active { background: #2a2a2a; border-color: #444; color: #fff; }
    .cal-container { background: #111; border: 1px solid #1f1f1f; border-radius: 8px; padding: 16px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: clamp(3px, 1vw, 5px); }
    .cal-day-header { text-align: center; font-size: 10px; color: #444; padding: 3px 0; }
    .cal-cell { border-radius: 6px; padding: 8px 6px; min-height: clamp(34px, 9vw, 48px); display: flex; align-items: flex-end; }
    .cal-cell-day { font-size: 10px; color: #555; }
    .cal-legend { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #888; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    hr { border: none; border-top: 1px solid #1a1a1a; margin: 20px 0; }
    .expander { border-bottom: 1px solid #1a1a1a; }
    .expander:last-child { border-bottom: none; }
    .expander-btn { width: 100%; background: none; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 14px 0; font-family: inherit; font-size: 14px; color: #888; text-align: left; }
    .expander-btn:hover { color: #aaa; }
    .expander-arrow { font-size: 10px; transition: transform 0.2s; }
    .expander-body { display: none; padding-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .expander-body table { min-width: 420px; }
    .expander.open .expander-body { display: block; }
    .expander.open .expander-arrow { transform: rotate(180deg); }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th { text-align: left; padding: 8px 12px; color: #555; font-weight: 500; border-bottom: 1px solid #1a1a1a; white-space: nowrap; }
    tbody td { padding: 8px 12px; color: #aaa; border-bottom: 1px solid #111; vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }
    tfoot td { padding: 8px 12px; color: #fff; font-weight: 600; border-top: 1px solid #2a2a2a; }
    a { color: #7c6aff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    #loading { display: flex; align-items: center; justify-content: center; min-height: 60vh; font-size: 13px; color: #555; }
    #error { display: none; padding: 20px; color: #ef4444; font-size: 13px; text-align: center; }
    #app { display: none; }
    #app.ready { display: block; }

    /* Tablet: stack the two charts */
    @media (max-width: 880px) {
      .charts-row { grid-template-columns: 1fr; }
    }

    /* Phone */
    @media (max-width: 560px) {
      .kpi-item { padding: 14px 16px; }
      .cal-container { padding: 12px; }
      .cal-legend { gap: 10px 16px; }
      .legend-item { font-size: 12px; }
      thead th, tbody td, tfoot td { padding: 7px 10px; }
    }

    /* Wide desktop: KPIs side by side */
    @media (min-width: 900px) {
      .kpi-stack { display: grid; grid-template-columns: repeat(3, 1fr); }
      .kpi-item + .kpi-item { border-top: none; }
      .kpi-item { border-top: 1px solid #1f1f1f; border-left: 1px solid #1f1f1f; }
      .kpi-item:nth-child(-n+3) { border-top: none; }
      .kpi-item:nth-child(3n+1) { border-left: none; }
    }

    @media print {
      body { background: #fff; color: #000; }
      .cal-toggle, #loading, #error { display: none !important; }
      .expander-body { display: block !important; }
    }
  </style>
</head>
<body>

<div id="loading">Loading trip data…</div>
<div id="error">Failed to load sheet. Make sure it is published to the web.<br><small style="color:#555">File → Share → Publish to web → CSV → Publish</small></div>

<div class="container" id="app">
  <div class="page-title">Australia Trip Dashboard</div>
  <div class="page-sub" id="page-sub"></div>
  <div class="kpi-stack" id="kpi-stack"></div>
  <div class="section-header">Breakdown</div>
  <div class="charts-row">
    <div class="chart-card"><div id="chart-donut"></div></div>
    <div class="chart-card"><div id="chart-bar"></div></div>
  </div>
  <div class="section-header">Budget vs Estimate</div>
  <div id="progress-bars"></div>
  <div class="section-header">Calendar View</div>
  <div class="cal-toggle">
    <button class="cal-btn active" onclick="switchCal('travel',this)">Travel</button>
    <button class="cal-btn" onclick="switchCal('leave',this)">Office Leave</button>
  </div>
  <div class="cal-container">
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-legend" id="cal-legend"></div>
  </div>
  <hr>
  <div id="tables"></div>
</div>

<script>
const SHEET_ID = '1gyNpebYNfYJdqOYmgcamOuWquUk6sqhJ6Dbfo7dBLf0';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
const COLORS   = ['#7c6aff','#3b82f6','#22c55e','#f59e0b','#ec4899'];
const CATS     = ['Flights','Accommodation','Food','Transport','Utilities'];

let calData = null;
let chartInputs = null;
let chartsDrawn = false;

// ── CSV parser ───────────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i <= text.length; i++) {
    const c = text[i];
    if (i === text.length) {
      row.push(field.trim());
      if (row.some(f => f)) rows.push(row);
      break;
    }
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else if (c === '"') {
      inQ = true;
    } else if (c === ',') {
      row.push(field.trim()); field = '';
    } else if (c === '\n' || c === '\r') {
      row.push(field.trim()); field = '';
      if (row.some(f => f)) rows.push(row);
      row = [];
      if (c === '\r' && text[i+1] === '\n') i++;
    } else {
      field += c;
    }
  }
  return rows;
}

// ── Section splitter ─────────────────────────────────────────────
function parseSections(rows) {
  const KNOWN = new Set(['TRIP INFO','FLIGHTS','ACCOMMODATION','FOOD','TRANSPORT','UTILITIES','BUDGET']);
  const out = {};
  let cur = null;
  for (const row of rows) {
    const k = (row[0] || '').trim().toUpperCase();
    if (KNOWN.has(k)) { cur = k; out[cur] = []; }
    else if (cur) out[cur].push(row);
  }
  return out;
}

// ── Helpers ──────────────────────────────────────────────────────
function parseMYR(s) {
  return parseFloat((s || '').replace(/[^0-9.]/g, '')) || 0;
}
function fmtMYR(v) {
  return 'MYR ' + Math.round(v).toLocaleString();
}
function extractDay(s) {
  const m = (s || '').match(/^(\d+)/);
  return m ? parseInt(m[1]) : null;
}
// Nov 1 2026 = Sunday = weekday 6 (Mon=0)
function novDow(day) { return (6 + day - 1) % 7; }

// Parse a table section: returns { headers, data, total }
function parseTable(rows) {
  const hi = rows.findIndex(r => r.some(c => c));
  if (hi < 0) return { headers: [], data: [], total: null };
  const headers = rows[hi].map(c => c.trim());
  const data = []; let total = null;
  for (let i = hi + 1; i < rows.length; i++) {
    const row = rows[i];
    const ti = row.findIndex(c => (c||'').trim().toLowerCase() === 'total');
    if (ti >= 0) {
      for (let j = ti + 1; j < row.length; j++) {
        if (row[j]?.trim()) { total = row[j].trim(); break; }
      }
    } else if (row.some(c => c)) {
      data.push(row);
    }
  }
  return { headers, data, total };
}

// Parse TRIP INFO key-value rows
function parseTripInfo(rows) {
  const info = {};
  for (const r of rows) {
    const k = (r[0]||'').trim();
    if (k) info[k] = (r[1]||'').trim();
  }
  return info;
}

// Parse BUDGET key-value rows
function parseBudget(rows) {
  const b = {};
  for (const r of rows) {
    const k = (r[0]||'').trim();
    if (k && k.toLowerCase() !== 'total') b[k] = parseMYR(r[1]);
  }
  return b;
}

// ── Main render ──────────────────────────────────────────────────
function render(sections) {
  const info      = parseTripInfo(sections['TRIP INFO']    || []);
  const flights   = parseTable(sections['FLIGHTS']         || []);
  const accom     = parseTable(sections['ACCOMMODATION']   || []);
  const food      = parseTable(sections['FOOD']            || []);
  const transport = parseTable(sections['TRANSPORT']       || []);
  const utils     = parseTable(sections['UTILITIES']       || []);
  const budget    = parseBudget(sections['BUDGET']         || []);

  const totals = [
    parseMYR(flights.total),
    parseMYR(accom.total),
    parseMYR(food.total),
    parseMYR(transport.total),
    parseMYR(utils.total),
  ];
  const grand = totals.reduce((a, b) => a + b, 0);

  document.getElementById('page-sub').textContent =
    `${info.Title||''} · ${info.Dates||''} · ${info.Pax||''}`;

  // KPI
  const nights = accom.data.reduce((s, r) => s + (parseInt(r[5])||0), 0);
  const kpis = [
    ['Grand Total',    fmtMYR(grand),        'All expenses'],
    ['Flights',        fmtMYR(totals[0]),    `${flights.data.length} segments`],
    ['Accommodation',  fmtMYR(totals[1]),    `${nights} nights`],
    ['Food',           fmtMYR(totals[2]),    'Both cities'],
    ['Transport',      fmtMYR(totals[3]),    'Both cities'],
    ['Utilities',      fmtMYR(totals[4]),    utils.data.map(r=>r[0]).filter(Boolean).join(', ')||'Misc.'],
  ];
  document.getElementById('kpi-stack').innerHTML = kpis.map(([label, val, sub]) =>
    `<div class="kpi-item"><div class="label">${label}</div><div class="kpi-val">${val}</div><div class="sub">${sub}</div></div>`
  ).join('');

  // Charts depend on the (deferred) Plotly bundle. Stash inputs and draw
  // when both the data and Plotly are ready — never block text/tables on it.
  chartInputs = { totals, grand, budget };
  tryCharts();

  // Progress bars
  document.getElementById('progress-bars').innerHTML = CATS.map((cat, i) => {
    const pct = grand ? Math.round((totals[i]/grand)*100) : 0;
    return `<div class="progress-wrap">
      <div class="progress-label"><span>${cat}</span><span style="color:#fff">${fmtMYR(totals[i])} <span style="color:#444">(${pct}%)</span></span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${COLORS[i]}"></div></div>
    </div>`;
  }).join('');

  // Calendar
  const flightDays = new Set(flights.data.map(r => extractDay(r[0])).filter(Boolean));
  const cityMap = {};
  accom.data.forEach(r => {
    const city = (r[1]||'').trim();
    const cin  = extractDay(r[3]);
    const cout = extractDay(r[4]);
    if (cin && cout) for (let d = cin; d < cout; d++) cityMap[d] = city;
  });
  const allDays   = [...flightDays, ...Object.keys(cityMap).map(Number)];
  const minDay    = allDays.length ? Math.min(...allDays) : 1;
  const maxDay    = allDays.length ? Math.max(...allDays) : 30;
  const days      = Array.from({length: maxDay - minDay + 1}, (_, i) => i + minDay);
  calData = { flightDays, cityMap, days, minDay };
  renderCal('travel');

  // Tables
  renderTables([
    { title: 'Flights',           t: flights   },
    { title: 'Accommodation',     t: accom     },
    { title: 'Food',              t: food      },
    { title: 'Transportation',    t: transport },
    { title: 'Utilities & Others',t: utils     },
  ]);
}

// ── Calendar ─────────────────────────────────────────────────────
const LEAVE_MAP = {
  7:['#0d2010','#22c55e'], 8:['#0d2010','#22c55e'], 9:['#2a0000','#ef4444'],
  10:['#2a1500','#f59e0b'],11:['#2a1500','#f59e0b'],12:['#2a1500','#f59e0b'],
  13:['#2a1500','#f59e0b'],14:['#0d2010','#22c55e'],15:['#0d2010','#22c55e'],
  16:['#2a1500','#f59e0b']
};

function renderCal(mode) {
  if (!calData) return;
  const { flightDays, cityMap, days, minDay } = calData;
  const baseDow = novDow(minDay);

  function style(day) {
    if (mode === 'travel') {
      if (flightDays.has(day))                              return ['#2a1f4a','#7c6aff'];
      const c = (cityMap[day]||'').toLowerCase();
      if (c.includes('sydney'))                             return ['#0d1a2e','#3b82f6'];
      if (c.includes('melbourne'))                          return ['#0d2010','#22c55e'];
      return ['#111111','#1f1f1f'];
    }
    return LEAVE_MAP[day] || ['#111111','#1f1f1f'];
  }

  let html = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
    .map(h=>`<div class="cal-day-header">${h}</div>`).join('');
  for (let i = 0; i < baseDow; i++) html += '<div></div>';
  days.forEach(day => {
    const [bg, border] = style(day);
    html += `<div class="cal-cell" style="background:${bg};border:1px solid ${border};">
      <div class="cal-cell-day">${day}</div></div>`;
  });
  document.getElementById('cal-grid').innerHTML = html;

  const legends = mode === 'travel'
    ? [['#2a1f4a','#7c6aff','Flight day'],['#0d1a2e','#3b82f6','Sydney'],
       ['#0d2010','#22c55e','Melbourne'],  ['#111111','#1f1f1f','No event']]
    : [['#0d2010','#22c55e','Public Holiday'],['#2a0000','#ef4444','Public Holiday (Special)'],
       ['#2a1500','#f59e0b','Office Leave'],   ['#111111','#1f1f1f','No event']];

  document.getElementById('cal-legend').innerHTML = legends.map(([bg,border,label])=>
    `<div class="legend-item"><div class="legend-swatch" style="background:${bg};border:1px solid ${border};"></div><span>${label}</span></div>`
  ).join('');
}

function switchCal(mode, btn) {
  document.querySelectorAll('.cal-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCal(mode);
}

// ── Tables ───────────────────────────────────────────────────────
function renderTables(sections) {
  function makeTable({ headers, data, total }) {
    if (!data.length) return '<p style="color:#555;font-size:12px;padding:8px 0">No data</p>';

    // Find which column index should show the total
    function totalColIdx() {
      let i = headers.findIndex(h => h.toLowerCase() === 'total');
      if (i < 0) i = headers.findIndex(h => h.toLowerCase() === 'cost');
      if (i < 0) i = headers.length - 1;
      return i;
    }

    const thead = `<thead><tr>${headers.map(h =>
      `<th>${h === 'Lounge URL' ? 'Lounge' : h}</th>`).join('')}</tr></thead>`;

    const tbody = `<tbody>${data.map(row =>
      `<tr>${headers.map((h, i) => {
        const v = (row[i]||'').trim();
        if (h === 'Lounge URL') return `<td>${v.startsWith('http') ? `<a href="${v}" target="_blank">Available</a>` : ''}</td>`;
        return `<td>${v}</td>`;
      }).join('')}</tr>`
    ).join('')}</tbody>`;

    const tfoot = total ? (() => {
      const ci = totalColIdx();
      const cells = headers.map((_, i) => {
        if (i === 0 && ci > 0) return `<td style="color:#666">Total</td>`;
        if (i === ci) return `<td>${total}</td>`;
        return '<td></td>';
      }).join('');
      return `<tfoot><tr>${cells}</tr></tfoot>`;
    })() : '';

    return `<table>${thead}${tbody}${tfoot}</table>`;
  }

  document.getElementById('tables').innerHTML = sections.map(({ title, t }) => `
    <div class="expander">
      <button class="expander-btn" onclick="this.closest('.expander').classList.toggle('open')">
        ${title} <span class="expander-arrow">▼</span>
      </button>
      <div class="expander-body">${makeTable(t)}</div>
    </div>`).join('');
}

// ── Charts (drawn once Plotly + data are both ready) ─────────────
function tryCharts() {
  if (chartsDrawn || !chartInputs || typeof Plotly === 'undefined') return;
  chartsDrawn = true;
  const { totals, grand, budget } = chartInputs;

  Plotly.newPlot('chart-donut', [{
    type: 'pie', labels: CATS, values: totals, hole: 0.65,
    marker: { colors: COLORS, line: { color: '#090909', width: 2 } },
    textinfo: 'none',
    hovertemplate: '<b>%{label}</b><br>MYR %{value:,.0f}<br>%{percent}<extra></extra>'
  }], {
    paper_bgcolor:'#111111', plot_bgcolor:'#111111',
    margin:{t:30,b:20,l:20,r:20},
    legend:{font:{color:'#888',size:12},bgcolor:'rgba(0,0,0,0)'},
    height:280,
    title:{text:'Expense Distribution',font:{color:'#666',size:12},x:0.02},
    annotations:[{text:`<b>${fmtMYR(grand)}</b>`,x:0.5,y:0.5,font:{size:16,color:'white'},showarrow:false}]
  }, {displayModeBar:false,responsive:true});

  const barColors = ['#7c6aff','#ec4899','#22c55e','#f59e0b'];
  Plotly.newPlot('chart-bar',
    Object.entries(budget).map(([name, val], i) => ({
      type:'bar', name, y:['Contribution'], x:[val], orientation:'h',
      marker:{color:barColors[i%barColors.length]}, width:0.3
    })),
    {
      paper_bgcolor:'#111111', plot_bgcolor:'#111111',
      margin:{t:40,b:20,l:60,r:20}, barmode:'stack',
      xaxis:{showgrid:true,gridcolor:'#1a1a1a',tickfont:{color:'#555',size:11},linecolor:'#1a1a1a'},
      yaxis:{showgrid:false,tickfont:{color:'#888',size:12},linecolor:'#1a1a1a'},
      height:180,
      title:{text:'Contribution Split',font:{color:'#666',size:12},x:0.02},
      legend:{font:{color:'#888',size:12},bgcolor:'rgba(0,0,0,0)'}
    }, {displayModeBar:false,responsive:true});
}

// ── Boot ─────────────────────────────────────────────────────────
// Data fetch was started in <head> (window.__sheetData) so it runs in
// parallel with the Plotly + font downloads. Render the moment it lands.
window.__sheetData
  .then(text => {
    render(parseSections(parseCSV(text)));
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('ready');
    tryCharts();
  })
  .catch(e => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display   = 'block';
    console.error('Sheet fetch failed:', e);
  });

// Plotly is deferred, so it's guaranteed loaded by DOMContentLoaded/load.
// These cover the case where data arrives before the bundle finishes.
document.addEventListener('DOMContentLoaded', tryCharts);
window.addEventListener('load', tryCharts);
</script>
</body>
</html>
