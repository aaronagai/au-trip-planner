  <style>
    :root {
      --bg:        #17130F;  /* warm ink */
      --bg-tint:   #1B160F;  /* faint warm panel */
      --surface:   #211B15;  /* cards */
      --surface-2: #2A231B;  /* raised */
      --border:    #322A20;  /* hairlines on surface */
      --border-soft:#241E17; /* faint dividers */
      --text:      #F5EFE6;  /* warm white */
      --text-dim:  #A89C8A;  /* warm gray */
      --text-faint:#6B6051;  /* labels */
      --accent:    #E08A4B;  /* outback ochre */
      --accent-soft:#3A2A1B; /* ochre-tinted bg */
      --terracotta:#C75D4A;
      --eucalyptus:#6FB6A3;
      --harbour:   #5B9BD5;
      --golden:    #E0A23C;
      --danger:    #E06B57;

      --pad: clamp(12px, 3vw, 24px);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Geist', system-ui, sans-serif; color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(120% 80% at 50% -10%, rgba(224,138,75,0.08), transparent 60%);
      background-attachment: fixed;
      padding: var(--pad);
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "ss01", "cv01";
    }
    .container { max-width: 1140px; margin: 0 auto; width: 100%; }

    .num { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: "tnum"; letter-spacing: -0.01em; }

    .label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 4px; }
    .page-title { font-family: 'Fraunces', Georgia, serif; font-size: clamp(26px, 6vw, 40px); font-weight: 600; font-optical-sizing: auto; line-height: 1.05; letter-spacing: -0.01em; color: var(--text); margin-bottom: 6px; }
    .page-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 32px; }
    .section-header { font-family: 'Fraunces', Georgia, serif; font-size: 17px; font-weight: 500; color: var(--text); letter-spacing: 0; text-transform: none; margin: 36px 0 14px 0; padding-bottom: 10px; border-bottom: 1px solid var(--border-soft); }
    .sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

    .kpi-stack { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 16px; }
    .kpi-item { padding: 18px 24px; transition: background 0.18s ease; }
    .kpi-item:hover { background: var(--surface-2); }
    .kpi-item + .kpi-item { border-top: 1px solid var(--border); }
    .kpi-val { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: "tnum"; font-size: 21px; font-weight: 500; letter-spacing: -0.02em; color: var(--text); margin: 3px 0; }

    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; overflow: hidden; }

    .progress-wrap { margin: 12px 0; }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
    .progress-track { background: var(--surface-2); border-radius: 4px; height: 5px; overflow: hidden; }
    .progress-fill { height: 5px; border-radius: 4px; transition: width 0.6s cubic-bezier(0.22,1,0.36,1); }

    .cal-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .cal-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius-sm); padding: 6px 16px; font-size: 11px; font-weight: 500; letter-spacing: 0.03em; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .cal-btn:hover { color: var(--text); border-color: var(--accent); }
    .cal-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .cal-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: clamp(3px, 1vw, 5px); }
    .cal-day-header { text-align: center; font-size: 10px; font-weight: 500; letter-spacing: 0.05em; color: var(--text-faint); padding: 3px 0; }
    .cal-cell { border-radius: var(--radius-sm); padding: 8px 6px; min-height: clamp(34px, 9vw, 50px); display: flex; align-items: flex-end; transition: transform 0.12s ease; }
    .cal-cell:hover { transform: translateY(-2px); }
    .cal-cell-day { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--text-dim); }
    .cal-legend { display: flex; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    hr { border: none; border-top: 1px solid var(--border-soft); margin: 24px 0; }
    .expander { border-bottom: 1px solid var(--border-soft); }
    .expander:last-child { border-bottom: none; }
    .expander-btn { width: 100%; background: none; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; font-family: 'Fraunces', Georgia, serif; font-size: 15px; font-weight: 500; color: var(--text-dim); text-align: left; transition: color 0.15s; }
    .expander-btn:hover { color: var(--text); }
    .expander-arrow { font-size: 10px; font-family: 'Geist', sans-serif; transition: transform 0.2s; }
    .expander-body { display: none; padding-bottom: 18px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .expander-body table { min-width: 420px; }
    .expander.open .expander-body { display: block; }
    .expander.open .expander-arrow { transform: rotate(180deg); }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th { text-align: left; padding: 9px 12px; color: var(--text-faint); font-weight: 500; letter-spacing: 0.03em; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody td { padding: 9px 12px; color: var(--text-dim); border-bottom: 1px solid var(--border-soft); vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { color: var(--text); }
    tfoot td { padding: 9px 12px; color: var(--text); font-weight: 600; border-top: 1px solid var(--border); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    #loading { display: flex; align-items: center; justify-content: center; min-height: 60vh; font-family: 'Fraunces', Georgia, serif; font-size: 15px; font-style: italic; color: var(--text-faint); }
    #error { display: none; padding: 20px; color: var(--danger); font-size: 13px; text-align: center; }
    #app { display: none; }
    #app.ready { display: block; animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Tablet: stack the two charts */
    @media (max-width: 880px) {
      .charts-row { grid-template-columns: 1fr; }
    }

    /* Phone */
    @media (max-width: 560px) {
      .kpi-item { padding: 14px 16px; }
      .cal-container { padding: 12px; }
      .cal-legend { gap: 10px 16px; }
      .legend-item { font-size: 12px; }
      thead th, tbody td, tfoot td { padding: 7px 10px; }
    }

    /* Wide desktop: KPIs side by side */
    @media (min-width: 900px) {
      .kpi-stack { display: grid; grid-template-columns: repeat(3, 1fr); }
      .kpi-item + .kpi-item { border-top: none; }
      .kpi-item { border-top: 1px solid #1f1f1f; border-left: 1px solid #1f1f1f; }
      .kpi-item:nth-child(-n+3) { border-top: none; }
      .kpi-item:nth-child(3n+1) { border-left: none; }
    }

    @media print {
      body { background: #fff; color: #000; }
      .cal-toggle, #loading, #error { display: none !important; }
      .expander-body { display: block !important; }
    }
  </style>
</head>

<script>
const SHEET_ID = '1gyNpebYNfYJdqOYmgcamOuWquUk6sqhJ6Dbfo7dBLf0';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
const COLORS   = ['#E08A4B','#C75D4A','#6FB6A3','#5B9BD5','#E0A23C'];
const CATS     = ['Flights','Accommodation','Food','Transport','Utilities'];
const INK      = '#17130F', SURFACE = '#211B15', GRID = '#322A20';
const TXT      = '#F5EFE6', TXT_DIM = '#A89C8A', TXT_FAINT = '#6B6051';
const PLOT_FONT= { family: 'Geist, system-ui, sans-serif' };

let calData = null;
let chartInputs = null;
let chartsDrawn = false;

// ── CSV parser ───────────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i <= text.length; i++) {
    const c = text[i];
    if (i === text.length) {
      row.push(field.trim());
      if (row.some(f => f)) rows.push(row);
      break;
    }
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else if (c === '"') {
      inQ = true;
    } else if (c === ',') {
      row.push(field.trim()); field = '';
    } else if (c === '\n' || c === '\r') {
      row.push(field.trim()); field = '';
      if (row.some(f => f)) rows.push(row);
      row = [];
      if (c === '\r' && text[i+1] === '\n') i++;
    } else {
      field += c;
    }
  }
  return rows;
}

// ── Section splitter ─────────────────────────────────────────────
function parseSections(rows) {
  const KNOWN = new Set(['TRIP INFO','FLIGHTS','ACCOMMODATION','FOOD','TRANSPORT','UTILITIES','BUDGET']);
  const out = {};
  let cur = null;
  for (const row of rows) {
    const k = (row[0] || '').trim().toUpperCase();
    if (KNOWN.has(k)) { cur = k; out[cur] = []; }
    else if (cur) out[cur].push(row);
  }
  return out;
}

// ── Helpers ──────────────────────────────────────────────────────
function parseMYR(s) {
  return parseFloat((s || '').replace(/[^0-9.]/g, '')) || 0;
}
function fmtMYR(v) {
  return 'MYR ' + Math.round(v).toLocaleString();
}
function extractDay(s) {
  const m = (s || '').match(/^(\d+)/);
  return m ? parseInt(m[1]) : null;
}
// Nov 1 2026 = Sunday = weekday 6 (Mon=0)
function novDow(day) { return (6 + day - 1) % 7; }

// Parse a table section: returns { headers, data, total }
function parseTable(rows) {
  const hi = rows.findIndex(r => r.some(c => c));
  if (hi < 0) return { headers: [], data: [], total: null };
  const headers = rows[hi].map(c => c.trim());
  const data = []; let total = null;
  for (let i = hi + 1; i < rows.length; i++) {
    const row = rows[i];
    const ti = row.findIndex(c => (c||'').trim().toLowerCase() === 'total');
    if (ti >= 0) {
      for (let j = ti + 1; j < row.length; j++) {
        if (row[j]?.trim()) { total = row[j].trim(); break; }
      }
    } else if (row.some(c => c)) {
      data.push(row);
    }
  }
  return { headers, data, total };
}

// Parse TRIP INFO key-value rows
function parseTripInfo(rows) {
  const info = {};
  for (const r of rows) {
    const k = (r[0]||'').trim();
    if (k) info[k] = (r[1]||'').trim();
  }
  return info;
}

// Parse BUDGET key-value rows
function parseBudget(rows) {
  const b = {};
  for (const r of rows) {
    const k = (r[0]||'').trim();
    if (k && k.toLowerCase() !== 'total') b[k] = parseMYR(r[1]);
  }
  return b;
}

// ── Main render ──────────────────────────────────────────────────
function render(sections) {
  const info      = parseTripInfo(sections['TRIP INFO']    || []);
  const flights   = parseTable(sections['FLIGHTS']         || []);
  const accom     = parseTable(sections['ACCOMMODATION']   || []);
  const food      = parseTable(sections['FOOD']            || []);
  const transport = parseTable(sections['TRANSPORT']       || []);
  const utils     = parseTable(sections['UTILITIES']       || []);
  const budget    = parseBudget(sections['BUDGET']         || []);

  const totals = [
    parseMYR(flights.total),
    parseMYR(accom.total),
    parseMYR(food.total),
    parseMYR(transport.total),
    parseMYR(utils.total),
  ];
  const grand = totals.reduce((a, b) => a + b, 0);

  document.getElementById('page-sub').textContent =
    `${info.Title||''} · ${info.Dates||''} · ${info.Pax||''}`;

  // KPI
  const nights = accom.data.reduce((s, r) => s + (parseInt(r[5])||0), 0);
  const kpis = [
    ['Grand Total',    fmtMYR(grand),        'All expenses'],
    ['Flights',        fmtMYR(totals[0]),    `${flights.data.length} segments`],
    ['Accommodation',  fmtMYR(totals[1]),    `${nights} nights`],
    ['Food',           fmtMYR(totals[2]),    'Both cities'],
    ['Transport',      fmtMYR(totals[3]),    'Both cities'],
    ['Utilities',      fmtMYR(totals[4]),    utils.data.map(r=>r[0]).filter(Boolean).join(', ')||'Misc.'],
  ];
  document.getElementById('kpi-stack').innerHTML = kpis.map(([label, val, sub]) =>
    `<div class="kpi-item"><div class="label">${label}</div><div class="kpi-val">${val}</div><div class="sub">${sub}</div></div>`
  ).join('');

  // Charts depend on the (deferred) Plotly bundle. Stash inputs and draw
  // when both the data and Plotly are ready — never block text/tables on it.
  chartInputs = { totals, grand, budget };
  tryCharts();

  // Progress bars
  document.getElementById('progress-bars').innerHTML = CATS.map((cat, i) => {
    const pct = grand ? Math.round((totals[i]/grand)*100) : 0;
    return `<div class="progress-wrap">
      <div class="progress-label"><span>${cat}</span><span class="num" style="color:var(--text)">${fmtMYR(totals[i])} <span style="color:var(--text-faint)">(${pct}%)</span></span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${COLORS[i]}"></div></div>
    </div>`;
  }).join('');

  // Calendar
  const flightDays = new Set(flights.data.map(r => extractDay(r[0])).filter(Boolean));
  const cityMap = {};
  accom.data.forEach(r => {
    const city = (r[1]||'').trim();
    const cin  = extractDay(r[3]);
    const cout = extractDay(r[4]);
    if (cin && cout) for (let d = cin; d < cout; d++) cityMap[d] = city;
  });
  const allDays   = [...flightDays, ...Object.keys(cityMap).map(Number)];
  const minDay    = allDays.length ? Math.min(...allDays) : 1;
  const maxDay    = allDays.length ? Math.max(...allDays) : 30;
  const days      = Array.from({length: maxDay - minDay + 1}, (_, i) => i + minDay);
  calData = { flightDays, cityMap, days, minDay };
  renderCal('travel');

  // Tables
  renderTables([
    { title: 'Flights',           t: flights   },
    { title: 'Accommodation',     t: accom     },
    { title: 'Food',              t: food      },
    { title: 'Transportation',    t: transport },
    { title: 'Utilities & Others',t: utils     },
  ]);
}

// ── Calendar ─────────────────────────────────────────────────────
const CAL_EMPTY = ['#1B160F','#322A20'];
const CAL_HOLIDAY = ['#15241B','#6FB6A3'];
const CAL_SPECIAL = ['#2A1512','#E06B57'];
const CAL_LEAVE   = ['#2A1E10','#E0A23C'];
const LEAVE_MAP = {
  7:CAL_HOLIDAY, 8:CAL_HOLIDAY, 9:CAL_SPECIAL,
  10:CAL_LEAVE,11:CAL_LEAVE,12:CAL_LEAVE,
  13:CAL_LEAVE,14:CAL_HOLIDAY,15:CAL_HOLIDAY,
  16:CAL_LEAVE
};

function renderCal(mode) {
  if (!calData) return;
  const { flightDays, cityMap, days, minDay } = calData;
  const baseDow = novDow(minDay);

  function style(day) {
    if (mode === 'travel') {
      if (flightDays.has(day))                              return ['#3A2A1B','#E08A4B'];
      const c = (cityMap[day]||'').toLowerCase();
      if (c.includes('sydney'))                             return ['#13202E','#5B9BD5'];
      if (c.includes('melbourne'))                          return ['#15241B','#6FB6A3'];
      return CAL_EMPTY;
    }
    return LEAVE_MAP[day] || CAL_EMPTY;
  }

  let html = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
    .map(h=>`<div class="cal-day-header">${h}</div>`).join('');
  for (let i = 0; i < baseDow; i++) html += '<div></div>';
  days.forEach(day => {
    const [bg, border] = style(day);
    html += `<div class="cal-cell" style="background:${bg};border:1px solid ${border};">
      <div class="cal-cell-day">${day}</div></div>`;
  });
  document.getElementById('cal-grid').innerHTML = html;

  const legends = mode === 'travel'
    ? [['#3A2A1B','#E08A4B','Flight day'],['#13202E','#5B9BD5','Sydney'],
       ['#15241B','#6FB6A3','Melbourne'],  CAL_EMPTY.concat('No event')]
    : [CAL_HOLIDAY.concat('Public Holiday'), CAL_SPECIAL.concat('Public Holiday (Special)'),
       CAL_LEAVE.concat('Office Leave'),     CAL_EMPTY.concat('No event')];

  document.getElementById('cal-legend').innerHTML = legends.map(([bg,border,label])=>
    `<div class="legend-item"><div class="legend-swatch" style="background:${bg};border:1px solid ${border};"></div><span>${label}</span></div>`
  ).join('');
}

function switchCal(mode, btn) {
  document.querySelectorAll('.cal-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCal(mode);
}

// ── Tables ───────────────────────────────────────────────────────
function renderTables(sections) {
  function makeTable({ headers, data, total }) {
    if (!data.length) return '<p style="color:var(--text-faint);font-size:12px;padding:8px 0">No data</p>';

    // Find which column index should show the total
    function totalColIdx() {
      let i = headers.findIndex(h => h.toLowerCase() === 'total');
      if (i < 0) i = headers.findIndex(h => h.toLowerCase() === 'cost');
      if (i < 0) i = headers.length - 1;
      return i;
    }

    const thead = `<thead><tr>${headers.map(h =>
      `<th>${h === 'Lounge URL' ? 'Lounge' : h}</th>`).join('')}</tr></thead>`;

    const tbody = `<tbody>${data.map(row =>
      `<tr>${headers.map((h, i) => {
        const v = (row[i]||'').trim();
        if (h === 'Lounge URL') return `<td>${v.startsWith('http') ? `<a href="${v}" target="_blank">Available</a>` : ''}</td>`;
        return `<td>${v}</td>`;
      }).join('')}</tr>`
    ).join('')}</tbody>`;

    const tfoot = total ? (() => {
      const ci = totalColIdx();
      const cells = headers.map((_, i) => {
        if (i === 0 && ci > 0) return `<td style="color:var(--text-faint)">Total</td>`;
        if (i === ci) return `<td>${total}</td>`;
        return '<td></td>';
      }).join('');
      return `<tfoot><tr>${cells}</tr></tfoot>`;
    })() : '';

    return `<table>${thead}${tbody}${tfoot}</table>`;
  }

  document.getElementById('tables').innerHTML = sections.map(({ title, t }) => `
    <div class="expander">
      <button class="expander-btn" onclick="this.closest('.expander').classList.toggle('open')">
        ${title} <span class="expander-arrow">▼</span>
      </button>
      <div class="expander-body">${makeTable(t)}</div>
    </div>`).join('');
}

// ── Charts (drawn once Plotly + data are both ready) ─────────────
function tryCharts() {
  if (chartsDrawn || !chartInputs || typeof Plotly === 'undefined') return;
  chartsDrawn = true;
  const { totals, grand, budget } = chartInputs;

  Plotly.newPlot('chart-donut', [{
    type: 'pie', labels: CATS, values: totals, hole: 0.65,
    marker: { colors: COLORS, line: { color: INK, width: 2 } },
    textinfo: 'none',
    hovertemplate: '<b>%{label}</b><br>MYR %{value:,.0f}<br>%{percent}<extra></extra>'
  }], {
    paper_bgcolor: SURFACE, plot_bgcolor: SURFACE, font: PLOT_FONT,
    margin:{t:30,b:20,l:20,r:20},
    legend:{font:{color:TXT_DIM,size:12},bgcolor:'rgba(0,0,0,0)'},
    height:280,
    title:{text:'Expense Distribution',font:{color:TXT_DIM,size:12},x:0.02},
    annotations:[{text:`<b>${fmtMYR(grand)}</b>`,x:0.5,y:0.5,font:{size:16,color:TXT},showarrow:false}]
  }, {displayModeBar:false,responsive:true});

  const barColors = [COLORS[0], COLORS[1], COLORS[2], COLORS[4]];
  Plotly.newPlot('chart-bar',
    Object.entries(budget).map(([name, val], i) => ({
      type:'bar', name, y:['Contribution'], x:[val], orientation:'h',
      marker:{color:barColors[i%barColors.length]}, width:0.3
    })),
    {
      paper_bgcolor: SURFACE, plot_bgcolor: SURFACE, font: PLOT_FONT,
      margin:{t:40,b:20,l:60,r:20}, barmode:'stack',
      xaxis:{showgrid:true,gridcolor:GRID,tickfont:{color:TXT_FAINT,size:11},linecolor:GRID},
      yaxis:{showgrid:false,tickfont:{color:TXT_DIM,size:12},linecolor:GRID},
      height:180,
      title:{text:'Contribution Split',font:{color:TXT_DIM,size:12},x:0.02},
      legend:{font:{color:TXT_DIM,size:12},bgcolor:'rgba(0,0,0,0)'}
    }, {displayModeBar:false,responsive:true});
}

// ── Boot ─────────────────────────────────────────────────────────
// Data fetch was started in <head> (window.__sheetData) so it runs in
// parallel with the Plotly + font downloads. Render the moment it lands.
window.__sheetData
  .then(text => {
    render(parseSections(parseCSV(text)));
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('ready');
    tryCharts();
  })
  .catch(e => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display   = 'block';
    console.error('Sheet fetch failed:', e);
  });

// Plotly is deferred, so it's guaranteed loaded by DOMContentLoaded/load.
// These cover the case where data arrives before the bundle finishes.
document.addEventListener('DOMContentLoaded', tryCharts);
window.addEventListener('load', tryCharts);
</script>
